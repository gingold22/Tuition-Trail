<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Tuition Trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column; a trail of stops on top, one decision per screen, then cost per year, payback, takeaways. One language at a time, picked on the first screen. */
:root{
  --bg:#EEF2F6; --panel:#FFFFFF; --ink:#16213D; --muted:#56637E; --line:#D3DAE5;
  --navy:#23407A; --navy-soft:#E3EAF7; --accent:#E3A014; --accent-soft:#FCF1D8;
  --good:#127A60; --good-soft:#DFF3EC; --bad:#B9402F; --bad-soft:#F9E3DF; --hs:#8E98AE; --under:#C08000;
  --es:#0B7A72; --es-on-btn:#C9EFEA;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-num:"DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1525; --panel:#172138; --ink:#E7ECF6; --muted:#9BA7C1; --line:#2A3655;
  --navy:#8EAEF0; --navy-soft:#1F2D4D; --accent:#F2B640; --accent-soft:#3A2F14;
  --good:#3CC39B; --good-soft:#14352D; --bad:#F07A6C; --bad-soft:#3E1F1C; --hs:#6F7B95; --under:#F2B640;
  --es:#5FD0C4; --es-on-btn:#0F3B37; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1525; --panel:#172138; --ink:#E7ECF6; --muted:#9BA7C1; --line:#2A3655;
  --navy:#8EAEF0; --navy-soft:#1F2D4D; --accent:#F2B640; --accent-soft:#3A2F14;
  --good:#3CC39B; --good-soft:#14352D; --bad:#F07A6C; --bad-soft:#3E1F1C; --hs:#6F7B95; --under:#F2B640;
  --es:#5FD0C4; --es-on-btn:#0F3B37; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(2rem,7vw,3rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(1.3rem,4.5vw,1.7rem);font-weight:800}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}


.top{display:flex;flex-direction:column;gap:6px}
.ridge{width:100%;height:46px;display:block}
.ridge path{fill:none;stroke:var(--navy);stroke-width:2}
.ridge .sun{fill:var(--accent);stroke:none}

.trail{display:flex;align-items:flex-start;overflow-x:auto;padding:4px 2px 2px;scrollbar-width:none}
.stop{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;color:var(--muted);font:inherit;cursor:default;min-width:58px;text-align:center}
.stop .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;font-family:var(--f-num);font-size:.75rem;color:var(--muted)}
.stop small{font-size:.7rem;white-space:nowrap;line-height:1.2}
.stop.done{cursor:pointer;color:var(--ink)}
.stop.done .dot{background:var(--navy);border-color:var(--navy);color:var(--panel)}
.stop.now .dot{border-color:var(--accent);background:var(--accent);color:#2A1C00}
.stop.now{color:var(--ink);font-weight:700}
.link{flex:1 1 12px;min-width:8px;height:0;border-top:2px dashed var(--line);margin-top:13px}
.link.done{border-top-color:var(--navy)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,4vw,26px);display:flex;flex-direction:column;gap:16px;min-width:0}
.qhead{display:flex;flex-direction:column;gap:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opts.tight{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{text-align:left;font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:border-color .15s, background .15s, transform .1s}
.opt:hover{border-color:var(--navy)}
.opt:active{transform:scale(.985)}
.opt[aria-pressed="true"]{border-color:var(--navy);background:var(--navy-soft)}
.opt b{font-size:1rem}
.opt .sub{font-size:.86rem;color:var(--muted)}
.opt .tag{font-family:var(--f-num);font-size:.84rem;color:var(--ink)}
.opt:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.btn{font:inherit;font-weight:700;border-radius:14px;padding:8px 18px;border:2px solid var(--navy);background:var(--navy);color:var(--panel);cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;line-height:1.25}
.btn.ghost{background:transparent;color:var(--navy)}
.btn:disabled{opacity:.4;cursor:not-allowed}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.95rem}
input[type=text]{font:inherit;font-weight:400;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%;max-width:320px}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:.92rem}
.note.blue{background:var(--navy-soft)}
.note.red{background:var(--bad-soft)}
.toggle{display:inline-flex;border:2px solid var(--line);border-radius:14px;padding:3px;gap:3px;flex-wrap:wrap}
.toggle button{font:inherit;font-size:.9rem;border:0;border-radius:11px;padding:6px 12px;background:transparent;color:var(--muted);cursor:pointer;line-height:1.25}
.toggle button[aria-pressed="true"]{background:var(--navy);color:var(--panel)}

.rates{display:flex;flex-direction:column;gap:10px}
.rate{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:.9rem}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);border-radius:6px}

/* results */
.yearcost{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:560px){.yearcost{grid-template-columns:1fr}}
.ledger{display:flex;flex-direction:column}
.ledger div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.ledger div.total{border-bottom:0;font-weight:700;font-size:1.02rem}
.ledger span:last-child{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .big{font-family:var(--f-num);font-size:clamp(1.2rem,4.6vw,1.55rem);font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere}
.tile .cap{font-size:.84rem;color:var(--muted)}
.tile.good{background:var(--good-soft);border-color:transparent}
.tile.bad{background:var(--bad-soft);border-color:transparent}
.good-t{color:var(--good)} .bad-t{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.82rem;border-radius:999px;padding:3px 10px;background:var(--navy-soft);color:var(--ink)}

.takeaways{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.takeaways li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px;border-radius:12px;background:var(--bg)}
.takeaways .amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:1.15rem;font-weight:500;padding:4px 10px;border-radius:8px;background:var(--good-soft);color:var(--good);white-space:nowrap}
.takeaways .amt.bad{background:var(--bad-soft);color:var(--bad)}
.takeaways .amt.neutral{background:var(--navy-soft);color:var(--navy)}
.takeaways p{font-size:1rem}
@media (max-width:480px){.takeaways li{grid-template-columns:1fr}.takeaways .amt{justify-self:start}}

.crowd{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:560px){.crowd{grid-template-columns:1fr}}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;max-width:200px}
.dots i{aspect-ratio:1;border-radius:50%;display:block;max-width:100%}
.d-field{background:var(--navy)} .d-under{background:var(--under)} .d-drop{background:var(--bad)}
.outs{display:flex;flex-direction:column;gap:10px}
.out{display:grid;grid-template-columns:14px 1fr;gap:10px;align-items:start;font-size:.95rem}
.out .sw2{width:14px;height:14px;border-radius:50%;margin-top:4px}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-num);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart path{fill:none;stroke-linejoin:round}
.chart .l-field{stroke:var(--navy);stroke-width:3}
.chart .l-friend{stroke:var(--under);stroke-width:2.5}
.chart .l-skip{stroke:var(--hs);stroke-width:2.5;stroke-dasharray:6 5}
.chart .gradline{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:2 3}
.chart .be{fill:var(--accent);stroke:var(--panel);stroke-width:2}
.chart .belbl{fill:var(--ink);font-family:var(--f-body);font-size:12px;font-weight:700}
.legend{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:.88rem}
.legend span{display:inline-flex;align-items:flex-start;gap:6px}
.sw{width:18px;height:0;border-top:3px solid var(--navy);display:inline-block;margin-top:9px;flex:none}
.sw.skip{border-top:3px dashed var(--hs)}
.sw.friend{border-top-color:var(--under)}

.knobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.knob{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.knob .kv{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.knob output{font-family:var(--f-num)}
input[type=range]{width:100%;accent-color:var(--navy)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:680px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.best td:first-child{font-weight:700}
.foot{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.foot a{color:var(--navy)}
.foot ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

const yrs = (n, en=true) => en ? `${n} ${n===1?"year":"years"}` : `${n} ${n===1?"año":"años"}`;

const inStateSchools = home => Object.keys(SCHOOLS).filter(id => SCHOOLS[id].st===home);
function schoolList(){ const ins = inStateSchools(S.home); return S.where==="in" ? ins : Object.keys(SCHOOLS).filter(id => !ins.includes(id)) }
const isOut = () => S.where==="out";
const isCC = st => !!st.school && SCHOOLS[st.school].type==="cc";
const isAssoc = st => isCC(st) && st.plan==="assoc";
const isTransfer = st => isCC(st) && st.plan==="transfer";
const degreeOf = st => isAssoc(st) ? ASSOC : MAJORS[st.major];
const pathName = st => { const s = SCHOOLS[st.school]; return isTransfer(st) ? `${s.short} → ${SCHOOLS[s.partner].short}` : s.short };
function steps(){
  if(S.where==="skip") return ["start","where","career","results"];
  const a = ["start","where","school"]; if(isOut()) a.push("gap"); a.push("grades"); if(!isAssoc(S)) a.push("major"); a.push("results"); return a;
}
const LABELS = {start:["You","Tú"], where:["Path","Camino"], school:["School","Escuela"], gap:["Wait?","¿Esperar?"], grades:["Grades","Notas"], major:["Major","Carrera"], career:["Job","Trabajo"], results:["Results","Resultados"]};

/* ================= MODEL ================= */
const skipPay = a => a<=35 ? SKIP0 + (SKIP35-SKIP0)*(a-18)/17 : SKIP35*Math.pow(1.01, a-35);
function skipSeries(){ const v=[]; let c=0; for(let a=18;a<=40;a++){ c+=skipPay(a); v.push(c) } return v }

// Job without college: starting pay at 18 (apprentices start near half of full pay), typical (median) pay by 35, then +1% a year.
const careerStart = c => c.kind==="appr" ? Math.min(c.p10, Math.round(c.med/2/10)*10) : c.p10;
const careerPay = (c, a) => { const s = careerStart(c); return a<=35 ? s + (c.med-s)*(a-18)/17 : c.med*Math.pow(1.01, a-35) };
function careerSeries(c){ const v=[]; let t=-c.cost; for(let a=18;a<=40;a++){ t+=careerPay(c,a); v.push(t) } return v }

function finishOdds(st){
  const g = GPA[st.gpa], sc = SCHOOLS[st.school];
  if(sc.type==="cc"){
    const cc = clamp(sc.g3 + sc.tr3 + g.adjcc, 3, 95);
    if(st.plan==="assoc") return cc/100;
    return cc/100 * sc.transferFinish * sc.admit[st.gpa];
  }
  return clamp(sc.g6 + g.adj4, 3, 97)/100;
}

function yearInfo(st, i, gap){
  const home = SCHOOLS[st.school];
  const sc = (isTransfer(st) && i>=2) ? SCHOOLS[home.partner] : home, out = st.where==="out";
  const f = Math.pow(RAISE, i+gap);
  let base;
  if(sc.type==="church") base = st.member ? sc.mem : sc.nonmem;
  else base = (!out || gap) ? sc.res : sc.non;
  return {sc, tuition:base*f, living:sc.living*f, books:BOOKS*f};
}

function attend(st, n){
  const gap = st.gap==="gap" ? 1 : 0, r = st.rate/100;
  const gapNet = gap ? Math.max(0, st.gapPay*0.9 - SCHOOLS[st.school].living) : 0;
  let tuition=0, living=0, books=0, borrowed=0, accrued=0; const yearCost=[], rows=[];
  for(let i=0;i<n;i++){
    const y = yearInfo(st, i, gap);
    tuition+=y.tuition; living+=y.living; books+=y.books;
    const full = y.tuition + y.living + y.books;
    const have = st.help + st.partTime + (i===0 ? gapNet : 0);
    const b = Math.max(0, full - have);
    borrowed += b; accrued += b * r * (n - i - 0.5);
    yearCost.push(y.tuition + y.books);
    rows.push({school:y.sc.short, tuition:y.tuition, living:y.living, books:y.books, total:full, loan:b});
  }
  const balance = borrowed + accrued, mr = r/12;
  const pay = balance ? balance*mr/(1-Math.pow(1+mr,-120)) : 0;
  const interest = accrued + (pay*120 - balance);
  return {gap, gapNet, tuition, living, books, cost: tuition+living+books, rows,
    borrowed, accrued, balance, pay, interest, yearCost, family:st.help*n, job:st.partTime*n, n};
}

function series(st, A, track){
  const deg = degreeOf(st);
  const salary = t => t<=15 ? deg.early + (deg.mid-deg.early)*t/15 : deg.mid*Math.pow(1.01, t-15);
  const exit = 18 + A.gap + A.n, v=[]; let c=0;
  for(let a=18;a<=40;a++){
    if(A.gap && a===18) c += st.gapPay;
    else if(a < exit) c += st.partTime - A.yearCost[a-18-A.gap];
    else {
      const t = a-exit;
      c += track==="field" ? salary(t) : track==="under" ? (t<5 ? TABLES*Math.pow(1.02,t) : 0.8*salary(t)) : skipPay(a)*1.05;
      if(t<10) c -= A.interest/10;
    }
    v.push(c);
  }
  return {v, exit, at35: salary(35-exit)};
}

function simulate(st){
  const sk = skipSeries();
  const n = st.years, dropN = isTransfer(st) ? 1 : Math.max(1, Math.floor(n/2));
  const A = attend(st, n), D = attend(st, dropN);
  const F = series(st, A, "field"), U = series(st, A, "under"), X = series(st, D, "drop");
  const P = finishOdds(st), u = GPA[st.gpa].under;
  const pF = P*(1-u), pU = P*u, pD = 1-P;
  const end = s => s.v[22] - sk[22];
  let breakEven=null; for(let i=0;i<23;i++){ if(18+i>=F.exit && F.v[i]>=sk[i]){ breakEven=18+i; break } }
  const sc=SCHOOLS[st.school]; let rate;
  if(sc.type==="church") rate = st.member ? ["church-member price","precio para miembros de la Iglesia"] : ["non-member price","precio para no miembros"];
  else rate = st.where!=="out" ? ["in-state price","precio para residentes"] : st.gap==="gap" ? ["in-state price (after 1 year of work)","precio de residente (después de 1 año de trabajo)"] : ["out-of-state price","precio para no residentes"];
  return {sk, A, D, F, X, P, u, pF, pU, pD, ends:{field:end(F), under:end(U), drop:end(X)}, breakEven, rate, gradAge:F.exit, dropAge:X.exit};
}

// The college friend a no-college player is compared with: a Business degree in 4 years at a school from their home state.
function friendPlan(){
  const pick = {NC:["unc","in"], CT:["uconn","in"], UT:["usu","in"], ID:["byui","in"], OTHER:["usu","out"]}[S.home] || ["usu","out"];
  return {...fresh(), home:S.home, where:pick[1], school:pick[0], gap:pick[1]==="out"?"now":null, gpa:"b", years:4, major:"bus", member:true};
}

/* ================= TRAIL ================= */
function renderTrail(){
  const list = steps(), cur = list.indexOf(step);
  $("#trail").innerHTML = list.map((s,i) => {
    const cls = i<cur ? "done" : i===cur ? "now" : "";
    const stop = `<button class="stop ${cls}" ${i<cur?`data-go="${s}"`:"disabled"} aria-label="${LABELS[s][0]}"><span class="dot">${i+1}</span><small>${L(LABELS[s][0],LABELS[s][1])}</small></button>`;
    return (i ? `<span class="link ${i<=cur?"done":""}"></span>` : "") + stop;
  }).join("");
  const now = document.querySelector(".stop.now"), tr = $("#trail");
  if(now && tr) tr.scrollLeft = Math.max(0, now.offsetLeft - tr.offsetLeft - tr.clientWidth/2 + now.offsetWidth/2);
}

/* ---------- No-college results ---------- */
function skipResults(){
  const c = CAREERS[S.career], who = S.name ? esc(S.name) : "";
  const mine = careerSeries(c), m40 = mine[22];
  const fp = friendPlan(), FR = simulate(fp), fs = SCHOOLS[fp.school];
  const friendName = [`a friend who earns a Business degree at ${fs.short} in 4 years`, `un amigo que saca un título en Administración de Empresas en ${fs.short} en 4 años`];
  const list = [];

  // 1. Best job
  let bestId = null, best = -Infinity;
  for(const [id,j] of Object.entries(CAREERS)){ const t = careerSeries(j)[22]; if(t>best){ best=t; bestId=id } }
  if(bestId===S.career) list.push(["neutral", L("Top","Mejor"), L(`${c.name} pays the most of these 10 jobs: about ${money(m40)} by age 40.`,`${c.es} es el que más paga de estos 10 trabajos: unos ${money(m40)} a los 40 años.`)]);
  else { const b = CAREERS[bestId], d = best - m40;
    list.push(["good", money(d), L(`If you picked ${b.name} instead of ${c.name}, you would earn about <b>${money(d)}</b> more by age 40.`,`Si eligieras ${b.es} en vez de ${c.es}, ganarías unos <b>${money(d)}</b> más a los 40 años.`)]); }

  // 2. Compared with a college friend
  const dF = m40 - FR.F.v[22], dX = m40 - FR.X.v[22], P = Math.round(FR.P*100);
  if(dF >= 0) list.push(["good", money(dF), L(`By 40 you'd have <b>${money(dF)}</b> more than ${friendName[0]}, even if they finish and get a job in their field.`,`A los 40 tendrías <b>${money(dF)}</b> más que ${friendName[1]}, aunque termine y consiga trabajo en su carrera.`)]);
  else list.push(["bad", money(-dF), L(`By 40, ${friendName[0]} would have <b>${money(-dF)}</b> more than you, if they finish and get a job in their field. ${P<60?"Only ":""}${P} out of 100 finish. If they don't, you'd be ${dX>=0?`${money(dX)} ahead`:`${money(-dX)} behind`}.`,
    `A los 40, ${friendName[1]} tendría <b>${money(-dF)}</b> más que tú, si termina y consigue trabajo en su carrera. ${P<60?"Solo ":""}${P} de cada 100 terminan. Si no termina, tú tendrías ${dX>=0?`${money(dX)} más`:`${money(-dX)} menos`}.`)]);

  // 3. How this job grows
  const start = careerStart(c);
  if(c.kind==="service") list.push(["bad", k(c.med), L(`Typical pay for ${c.name.toLowerCase()} is ${money(c.med)} a year, even after many years. Pay grows slowly, and tips go up and down.`,`El sueldo típico de ${c.es.toLowerCase()} es ${money(c.med)} al año, incluso después de muchos años. El sueldo sube despacio, y las propinas cambian mucho.`)]);
  else if(c.kind==="appr") list.push(["good", "$0", L(`You get paid while you train, with no student loans. Pay goes from about ${money(start)} as an apprentice to ${money(c.med)} when fully trained.`,`Te pagan mientras aprendes, sin préstamos de estudios. El sueldo va de unos ${money(start)} como aprendiz a ${money(c.med)} cuando terminas de entrenarte.`)]);
  else list.push(["neutral", money(c.cost), L(`Training costs about ${money(c.cost)} and takes months, not years, so you start earning about ${money(start)} right away.`,`El entrenamiento cuesta unos ${money(c.cost)} y dura meses, no años, así que empiezas a ganar unos ${money(start)} enseguida.`)]);

  return `<section class="panel">
    <div class="qhead"><span class="eyebrow">${L("Results","Resultados")}</span>
    <h2>${L(`${who?who+"'s":"Your"} plan: ${esc(c.name)}, no college`,`Plan${who?" de "+who:""}: ${esc(c.es)}, sin universidad`)}</h2>
    <div class="chips"><span class="chip">${L(c.how[0], c.how[1])}</span></div></div>
    <div class="tiles">
      <div class="tile ${c.cost?"":"good"}"><span class="cap">${L("Training cost","Costo del entrenamiento")}</span><span class="big">${money(c.cost)}</span><span class="cap">${L("No student loans","Sin préstamos de estudios")}</span></div>
      <div class="tile"><span class="cap">${L("Pay at 18","Sueldo a los 18")}</span><span class="big">${money(start)}</span><span class="cap">${L("per year","por año")}</span></div>
      <div class="tile"><span class="cap">${L("Typical pay by 35","Sueldo típico a los 35")}</span><span class="big">${money(c.med)}</span><span class="cap">${L("per year","por año")}</span></div>
      <div class="tile"><span class="cap">${L("Total earned by 40","Total ganado a los 40")}</span><span class="big">${k(m40)}</span><span class="cap">${L("23 years of work","23 años de trabajo")}</span></div>
    </div>
  </section>

  <section class="panel">
    <h3>${L("What would change your result","Lo que cambiaría tu resultado")}</h3>
    <ul class="takeaways">${list.map(liAmt).join("")}</ul>
  </section>

  <section class="panel">
    <div class="qhead"><h3>${L("Your money, age 18 to 40","Tu dinero, de los 18 a los 40 años")}</h3>
    <p class="muted small">${L(`Total earned, minus training or college costs and loan interest. The college friend's line starts below zero while they pay for ${fs.short}.`,`Total ganado, menos el costo del entrenamiento o de la universidad y los intereses del préstamo. La línea del amigo empieza bajo cero mientras paga ${fs.short}.`)}</p></div>
    <div class="legend"><span><i class="sw"></i>${L(`You: ${c.name}`,`Tú: ${c.es}`)}</span><span><i class="sw friend"></i>${L(`Friend: Business degree at ${fs.short}`,`Amigo: Administración de Empresas en ${fs.short}`)}</span></div>

/* ---------- College results ---------- */
function takeaways(R){
  const s = SCHOOLS[S.school], A = R.A, list = [], deg = degreeOf(S);
  // 1. Time
  if(!isAssoc(S)){
    if(S.years>4){
      const f = simulate({...S, years:4}), save = A.cost - f.A.cost, more = f.ends.field - R.ends.field, n = S.years-4;
      list.push(["good", money(save), L(`If you graduated in 4 years instead of ${S.years}, you would pay <b>${money(save)}</b> less for school and start working ${yrs(n)} sooner. That's about <b>${money(more)}</b> more for you by age 40.`,
        `Si te gradúas en 4 años en vez de ${S.years}, pagarías <b>${money(save)}</b> menos en la escuela y empezarías a trabajar ${yrs(n,false)} antes. Eso es unos <b>${money(more)}</b> más para ti a los 40 años.`)]);
    } else {
      const f = simulate({...S, years:6}), extra = f.A.cost - A.cost;
      list.push(["good", money(extra), L(`Finishing in 4 years saves you <b>${money(extra)}</b> compared with taking 6 years.${s.g4 && s.g4<50 ? ` Only ${s.g4} out of 100 ${esc(s.short)} students do it, so you need a plan from day one.` : ""}`,
        `Terminar en 4 años te ahorra <b>${money(extra)}</b> comparado con tardar 6 años.${s.g4 && s.g4<50 ? ` Solo ${s.g4} de cada 100 estudiantes de ${esc(s.short)} lo logran, así que necesitas un plan desde el primer día.` : ""}`)]);
    }
  }
  // 2. Residency
  if(s.type!=="church"){
    const st = STATE_NAME[s.st], ste = STATE_ES[s.st];
    if(isOut() && S.gap==="now"){
      const o = simulate({...S, gap:"gap"}), save = A.cost - o.A.cost;
      list.push(["good", money(save), L(`If you worked one year in ${st} first and got the in-state price, you would save <b>${money(save)}</b> on school, and earn about ${money(S.gapPay)} that year.`,
        `Si trabajaras un año en ${ste} primero y obtuvieras el precio de residente, ahorrarías <b>${money(save)}</b> en la escuela y ganarías unos ${money(S.gapPay)} ese año.`)]);
    } else if(isOut() && S.gap==="gap"){
      const o = simulate({...S, gap:"now"}), save = o.A.cost - A.cost;
      list.push(["good", money(save), L(`Working one year first to get the in-state price saves you <b>${money(save)}</b> on school.`,`Trabajar un año primero para obtener el precio de residente te ahorra <b>${money(save)}</b> en la escuela.`)]);
    } else {
      const o = simulate({...S, where:"out", gap:"now"}), save = o.A.cost - A.cost;
      list.push(["good", money(save), L(`Staying in your home state saves you <b>${money(save)}</b> compared with paying the out-of-state price at ${esc(pathName(S))}.`,`Quedarte en tu estado te ahorra <b>${money(save)}</b> comparado con pagar el precio de no residente en ${esc(pathName(S))}.`)]);
    }
  }
  // 3. Major
  if(!isAssoc(S)){
    let best=null;
    for(const id of Object.keys(MAJORS)){
      const r = simulate({...S, major:id}), be = r.breakEven ?? 99;
      if(!best || be<best.be || (be===best.be && r.ends.field>best.end)) best={id, be, end:r.ends.field};
    }
    const mine = R.breakEven, bm = MAJORS[best.id];
    if(best.id===S.major) list.push(["neutral", L("Best","Mejor"), L(`${deg.name} pays you back faster than any other major in this game.`,`${deg.es} te devuelve tu dinero más rápido que cualquier otra carrera en este juego.`)]);
    else if(mine && best.be<99) list.push(["good", `${mine-best.be} ${L("yrs","años")}`, L(`If you picked ${bm.name} instead of ${deg.name}, college would pay you back at age <b>${best.be}</b> instead of ${mine}. That's ${yrs(mine-best.be)} sooner.`,
      `Si eligieras ${bm.es} en vez de ${deg.es}, la universidad te devolvería tu dinero a los <b>${best.be}</b> años en vez de a los ${mine}. Eso es ${yrs(mine-best.be,false)} antes.`)]);
    else if(best.be<99) list.push(["bad", L("Never","Nunca"), L(`With ${deg.name}, college does not pay you back by age 40. With ${bm.name}, it would pay you back at age <b>${best.be}</b>.`,
      `Con ${deg.es}, la universidad no te devuelve tu dinero antes de los 40 años. Con ${bm.es}, te lo devolvería a los <b>${best.be}</b> años.`)]);
  }
  // 4. Grades
  if(["c","d","f"].includes(S.gpa)){
    const o = Math.round(finishOdds({...S, gpa:"b"})*100), now = Math.round(R.P*100);
    list.push(["bad", `${now}%`, L(`With your grades, ${now<60?"only ":""}${now} out of 100 students like you finish. With a 3.4 or higher, ${o} out of 100 finish. The ones who don't finish still owe their loans.`,
      `Con tus notas, ${now<60?"solo ":""}${now} de cada 100 estudiantes como tú terminan. Con 3.4 o más, terminan ${o} de cada 100. Los que no terminan igual deben sus préstamos.`)]);
  }
  if(A.borrowed > FED_LIMIT) list.push(["bad", money(A.borrowed), L(`You would borrow ${money(A.borrowed)}. Most students can only get about ${money(FED_LIMIT)} in government student loans. The rest would need parent or bank loans, which usually cost more.`,
    `Pedirías prestado ${money(A.borrowed)}. La mayoría de los estudiantes solo pueden recibir unos ${money(FED_LIMIT)} en préstamos del gobierno. El resto tendría que venir de préstamos de los padres o del banco, que suelen costar más.`)]);
  return list.map(liAmt).join("");
}

/* ================= CHART ================= */
function chart({lines, grad, be}){
  const W=640,H=300,L0=58,Rr=16,T=16,B=34, all=lines.flatMap(l=>l.v);
  let lo=Math.min(0,...all), hi=Math.max(...all);
  const raw=(hi-lo)/4, mag=Math.pow(10,Math.floor(Math.log10(raw))), st=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=raw);
  lo=Math.floor(lo/st)*st; hi=Math.ceil(hi/st)*st;
  const X=a=>L0+(a-18)/22*(W-L0-Rr), Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let g="";
  for(let v=lo; v<=hi+1; v+=st) g+=`<line class="grid" x1="${L0}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L0-8}" y="${Y(v)+4}" text-anchor="end">${k(v)}</text>`;
  for(let a=18;a<=40;a+=2) g+=`<text x="${X(a)}" y="${H-12}" text-anchor="middle">${a}</text>`;
  if(lo<0) g+=`<line class="zero" x1="${L0}" x2="${W-Rr}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  if(grad) g+=`<line class="gradline" x1="${X(grad)}" x2="${X(grad)}" y1="${T}" y2="${H-B}"/><text x="${X(grad)+4}" y="${T+10}">${L("graduate","graduación")}</text>`;
  for(const l of lines) g+=`<path class="${l.cls}" d="${l.v.map((v,i)=>(i?"L":"M")+X(18+i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ")}"/>`;
  if(be){ const right = be.age > 33; g+=`<circle class="be" cx="${X(be.age)}" cy="${Y(be.v)}" r="7"/><text class="belbl" x="${X(be.age)+(right?-12:12)}" y="${Y(be.v)-12}" text-anchor="${right?"end":"start"}">${L("paid back","recuperado")} (${be.age})</text>`; }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart of total money from age 18 to 40">${g}</svg>`;
}

<li>Sueldos con título: medianas por carrera del ${A("https://www.newyorkfed.org/research/college-labor-market","Banco de la Reserva Federal de Nueva York")} (datos de 2024; algunas carreras redondeadas), que también encontró que 42% de los recién graduados trabaja en empleos que no necesitan título.</li>
<li>Trabajos sin universidad: ${A("https://www.bls.gov/ooh/","Oficina de Estadísticas Laborales (BLS)")}, sueldos de mayo de 2025. El sueldo a los 18 es el del 10% que menos gana (los aprendices empiezan con cerca de la mitad del sueldo completo); el sueldo típico a los 35 es la mediana. El sueldo de restaurante incluye propinas. Los costos de entrenamiento para camionero, soldador y HVAC son estimaciones del juego.</li>
<li>Préstamos: ${A("https://www.collegehelpguide.com/blog/federal-loan-rates-confirmed-2026-27/","tasa federal de 6.52% para 2026–27")}. Los intereses crecen mientras estudias y luego pagas en 10 años.</li>
<li>Estimaciones del juego: cuánto cambian las notas la probabilidad de terminar y de conseguir trabajo en tu carrera; los graduados que trabajan de meseros ganan sueldo de mesero por 5 años y luego 80% del sueldo de su carrera; vivienda en Utah State, UVU, BYU y los community colleges; no ir a la universidad paga ${money(SKIP0)} a los 18 y sube a ${money(SKIP35)} a los 35; los precios suben 3% al año.</li>
</ul>`;

<ul>

<li>Graduation: school reports and federal data; UNC 85% in 4 years and 91% in 6; <a href="https://nces.ed.gov/collegenavigator/?id=198260" target="_blank" rel="noopener">Central Piedmont 31% graduate and 26% transfer</a>; <a href="https://ctstate.edu/retention-and-outcomes" target="_blank" rel="noopener">CT State graduation and transfer rates</a>; <a href="https://www.ct.edu/transfer/uconn" target="_blank" rel="noopener">UConn transfer guarantee</a>; <a href="https://www.cpcc.edu/academics/transfer/unc-chapel-hill-c-step" target="_blank" rel="noopener">UNC C-STEP</a> (79% of C-STEP students graduate); <a href="https://www.cfnc.org/plan-your-future/plan-for-college/transfer-student-planner/transfer-student-guarantees/" target="_blank" rel="noopener">NC transfer guarantee</a>.</li>
<li>College pay: <a href="https://www.newyorkfed.org/research/college-labor-market" target="_blank" rel="noopener">New York Fed</a> medians by major (2024 data; some majors rounded) and its finding that 42% of recent grads work jobs that don't need a degree.</li>
<li>Jobs without college: <a href="https://www.bls.gov/ooh/" target="_blank" rel="noopener">BLS Occupational Outlook Handbook</a>, May 2025 pay. Pay at 18 is the lowest-10% pay (apprentices start at about half of full pay); typical pay by 35 is the median. Restaurant pay includes tips. Training costs for truck driving, welding and HVAC are game estimates.</li>
<li>Loans: <a href="https://www.collegehelpguide.com/blog/federal-loan-rates-confirmed-2026-27/" target="_blank" rel="noopener">6.52% federal rate for 2026–27</a>. Interest builds while you're in school, then you repay over 10 years.</li>
<li>Game estimates: how grades change the chance of finishing and of a job in your field; grads waiting tables earn waiter pay for 5 years, then 80% of their field's pay; housing at Utah State, UVU, BYU and the community colleges; skipping college pays ${money(SKIP0)} at 18 rising to ${money(SKIP35)} by 35; prices rise 3% a year.</li>

function renderHeader(){
  document.documentElement.lang = LANG;
  $("#top").innerHTML = `<svg class="ridge" viewBox="0 0 720 46" preserveAspectRatio="none" aria-hidden="true">
      <circle class="sun" cx="610" cy="16" r="9"/>
      <path d="M0 42 L70 26 L110 34 L180 10 L230 28 L290 18 L350 36 L420 14 L470 24 L530 6 L590 30 L650 22 L720 38"/>
    </svg>
    <div class="row"><span class="eyebrow">${L("A college money game","Un juego sobre el costo de la universidad")}</span><span class="spacer"></span>
      <div class="toggle" role="group" aria-label="Language / Idioma"><button data-lang="en" aria-pressed="${LANG==="en"}">English</button><button data-lang="es" aria-pressed="${LANG==="es"}">Español</button></div></div>
    <h1>${L("The Tuition Trail","El camino de la matrícula")}</h1>
    <p class="muted">${L("Pick a path. See what college costs each year and how long it takes to pay you back.","Elige un camino. Mira cuánto cuesta la universidad cada año y cuánto tarda en devolverte lo que pagaste.")}</p>`;
}

/* ================= MAIN ================= */
function render(focusTop){
  renderHeader(); renderFoot();
  if(!steps().includes(step)) step="start";
  renderTrail();
  $("#app").innerHTML = VIEWS[step]();
  renderCompare();
  const n=$("#pname"); if(n) n.addEventListener("input", e=>{ S.name=e.target.value });
  if(focusTop) $("#trail").scrollIntoView({block:"start", behavior:"smooth"});
}
function go(dir){ const l=steps(), i=l.indexOf(step); step = l[clamp(i+dir,0,l.length-1)]; render(true) }
const advanceSoon = () => setTimeout(()=>go(1), 220);

document.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t || t.disabled) return;
  const d = t.dataset;
  if(d.lang){ LANG = d.lang==="es" ? "es" : "en"; try{ localStorage.setItem("tt-lang", LANG) }catch(err){} const y=window.scrollY; render(); window.scrollTo(0,y); return }
  if(d.go){ step=d.go; render(true); return }
  if(d.back!==undefined){ go(-1); return }
  if(d.next!==undefined){ go(1); return }
  if(t.id==="go1"){ go(1); return }
  if(d.home){ if(S.home!==d.home){ S.home=d.home; S.where=null; S.school=null; S.gap=null } render(); return }
  if(d.where){ if(S.where!==d.where){ S.where=d.where; S.school=null; S.gap=null } render(); advanceSoon(); return }
  if(d.career){ S.career=d.career; render(); advanceSoon(); return }
  if(d.school){ if(S.school!==d.school){ S.school=d.school; S.years=null } render(); return }
  if(d.member){ S.member = d.member==="1"; render(); return }
  if(d.plan){ if(S.plan!==d.plan){ S.plan=d.plan; S.years=null } render(); return }
  if(d.gap){ S.gap=d.gap; render(); advanceSoon(); return }
  if(d.gpa){ S.gpa=d.gpa; render(); return }
  if(d.years){ S.years=+d.years; render(); return }
  if(d.major){ S.major=d.major; render(); advanceSoon(); return }
  if(d.example!==undefined){ S={...fresh(), name:"Example", home:"OTHER", where:"out", school:"uconn", gap:"now", gpa:"c", years:6, major:"psych"}; step="results"; render(true); return }
  if(d.restart!==undefined){ S=fresh(); step="start"; render(true); return }
  if(d.save!==undefined){
    let row;
    if(S.where==="skip"){ const c=CAREERS[S.career]; row={name:S.name, plan:[c.name, c.es], detail:["No college","Sin universidad"], perYear:0, loan:0, be:null, odds:"—", skip:true, m40:careerSeries(c)[22]} }
    else {
      const R=simulate(S), deg=degreeOf(S);
      row={name:S.name, plan:[`${deg.name} · ${pathName(S)}`, `${deg.es} · ${pathName(S)}`],
        detail:[`${R.rate[0]}, GPA ${GPA[S.gpa].label}, ${S.years} yrs`, `${R.rate[1]}, GPA ${GPA[S.gpa].les||GPA[S.gpa].label}, ${S.years} años`],
        perYear:R.A.rows[0].total, loan:R.A.borrowed, be:R.breakEven, odds:Math.round(R.P*100)+"%", m40:R.F.v[22]};
    }
    saved.push(row); if(saved.length>10) saved.shift();
    try{ localStorage.setItem("tt-saved5", JSON.stringify(saved)) }catch(err){}
    renderCompare(); t.innerHTML=L("Saved","Guardado"); setTimeout(()=>{ t.innerHTML=L("Save this plan","Guardar este plan") },1400); return
  }
  if(d.clear!==undefined){ saved=[]; try{ localStorage.removeItem("tt-saved5") }catch(err){} renderCompare(); return }
});
document.addEventListener("input", e=>{
  const id=e.target.dataset.knob; if(!id) return;
  S[id]=+e.target.value;
  const o=document.getElementById("o-"+id); if(o) o.textContent = id==="rate" ? (+e.target.value).toFixed(2)+"%" : money(+e.target.value);
});
document.addEventListener("change", e=>{
  const id=e.target.dataset.knob; if(!id) return;
  const y=window.scrollY; render(); window.scrollTo(0,y);
  const el=document.getElementById("k-"+id); if(el) el.focus({preventScroll:true});
});
render();
</script>
